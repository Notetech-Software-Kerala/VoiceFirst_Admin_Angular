<form class="row g-3">

    <div class="col-md-12">
        <label class="form-label">Post Office<span class="text-danger">*</span></label>

        <div class="dropdown w-100">
            <button class="form-select text-start" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                style="min-height: 38px;">
                {{ selectedPostOfficeId ? selectedPostOfficeName : 'Select Post Office' }}
            </button>

            <ul class="dropdown-menu w-100 p-0 shadow-sm custom-dropdown-menu"
                style="max-height: 300px; overflow-y: auto;">
                <li class="p-2 border-bottom sticky-top custom-dropdown-header-footer" style="z-index: 3;"
                    (click)="$event.stopPropagation()">
                    <input type="text" class="form-control form-control-sm" placeholder="Search Post Office..."
                        (input)="onDropdownSearch($event)" autofocus>
                </li>
                <li *ngIf="currentPage > 1" class="border-bottom sticky-top custom-dropdown-header-footer"
                    style="z-index: 2;">
                    <button type="button" class="dropdown-item custom-pagination-btn fw-bold py-2"
                        (click)="onPrevPage($event)">
                        &laquo; Previous Page
                    </button>
                </li>

                <li *ngFor="let postOffice of postOffices">
                    <button type="button" class="dropdown-item py-2"
                        [class.active]="selectedPostOfficeId === postOffice.postOfficeId"
                        (click)="onPostOfficeSelectTrigger(postOffice)">
                        {{postOffice.postOfficeName}}
                    </button>
                </li>

                <li *ngIf="postOffices.length === 0"
                    class="text-center text-muted p-2 small custom-dropdown-header-footer">
                    <span *ngIf="loading$ | async">Loading...</span>
                    <span *ngIf="!(loading$ | async)">No post offices found.</span>
                </li>

                <li *ngIf="currentPage < totalPages" class="border-top sticky-bottom custom-dropdown-header-footer"
                    style="z-index: 2;">
                    <button type="button" class="dropdown-item custom-pagination-btn fw-bold py-2"
                        (click)="onNextPage($event)">
                        Next Page &raquo;
                    </button>
                </li>
            </ul>
        </div>

        <div class="mt-2 d-flex justify-content-between text-muted small">
            <span>Page {{ currentPage }} of {{ totalPages || 1 }}</span>
            <span *ngIf="loading$ | async" class="text-primary">Loading...</span>
        </div>
    </div>

</form>
